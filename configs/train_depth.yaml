defaults:
  - data: ???
  - model: ???
  - _self_
  - experiment: null

size: ???

gradient_checkpointing: false
gradient_accumulation_steps: 1

learning_rate: 1e-4
lr_warmup_steps: 0
lr_scheduler: constant

epochs: 10
val_steps: 1000
ckpt_steps: 1000

# Early stopping: if val/loss produces no new best for this many full epochs,
# training stops itself (best_model/ is already saved). 0 = never stop early.
# Good for detached runs you don't watch — it quits once it plateaus.
early_stop_patience: 3

prompt: null

seed: 42
val_batches: 4
log_every_steps: 50   # mirror step/loss/lr into the run's .log file every N optimizer steps

bf16: false
ignore_check: false
tag: ''
local_files_only: false

hydra:
  run:
    dir: outputs/train/${tag}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/train/${tag}/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
