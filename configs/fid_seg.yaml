# configs/fid_seg.yaml
# ---------------------
# Base config for seg_fid_eval.py. Extends inference_seg.yaml (same base
# model, VAE, checkpoint format, resize_mode) so the model FID measures is
# guaranteed identical to what segformer_inference.py actually runs -- only
# the fid: block below is new.

defaults:
  - inference_seg
  - _self_

fid:
  # REQUIRED: manifest to draw (seg_path, raw_image_path, prompt) triplets
  # from. raw_image_path is REQUIRED here (unlike inference_seg.yaml, where
  # it's display-only) -- FID needs a real photo to compare each generation
  # against the real-image distribution.
  json_file: ???

  # FID is a distribution-distance metric, not a per-image score -- it needs
  # a large pool to be stable (>=1000 is the common floor in FID literature).
  # A small n_samples only tests that the pipeline runs; the printed number
  # is not meaningful until n_samples is large.
  n_samples: 1000

  # Generated + real images are both written here (two subfolders) so
  # torch_fidelity can scan them; kept after the run for inspection/reuse
  # in a later comparison, not deleted automatically.
  output_dir: outputs/fid/seg_${resize_mode}/results

hydra:
  run:
    dir: outputs/fid/seg_${resize_mode}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true
