# configs/inference_seg.yaml
# --------------------------
# Base config for segformer_inference.py — the segmentation twin of inference_depth.yaml.
#
# Loads a trained segmentation-conditioned LoRAdapter checkpoint and generates
# images conditioned on a PROVIDED SegFormer-b5-Cityscapes segmentation map
# for each input.
#
# HOW IT WORKS:
#   - Inference ALWAYS uses a PROVIDED segmentation map (seg_path) -- it
#     NEVER computes one live from a raw photo. See segformer_inference.py's
#     module docstring for the full mechanism (skip_encode=True, exactly
#     like training).
#   - resize_mode (below) only affects the ORIGINAL display panel's geometry
#     (cosmetic) -- the seg map itself was already squared at CALC time by
#     seg_map_calculations.py, so there is no live train/inference squaring
#     mismatch possible here (unlike the grounded_sam branch).
#
# USAGE — from a JSON manifest (recommended):
#   python segformer_inference.py \
#       ckpt_path=outputs/train/seg_aspect/runs/YYYY-MM-DD/HH-MM-SS/best_model \
#       resize_mode=aspect \
#       inference.json_file=data/seg_training_aspect/test.jsonl
#
# USAGE — direct seg map + optional raw image for the display panel:
#   python segformer_inference.py \
#       ckpt_path=outputs/train/seg_aspect/runs/YYYY-MM-DD/HH-MM-SS/best_model \
#       resize_mode=aspect \
#       "inference.seg_maps=[data/raw_seg/000417/000417_seg_map.png]" \
#       "inference.images=[data/raw/000417/raw_image.jpg]" \
#       "inference.prompts=['driving in rain at night']"
#
# OUTPUT (per input image, under outputs/inference/seg_<mode>/results/<timestamp>/):
#       <stem>_grid.jpg        ← 4-panel: ORIGINAL | SEG MAP | PREDICTED | RAW SEG GEN
#       <stem>_original.jpg
#       <stem>_seg.jpg         ← SegFormer-b5 colour conditioning map
#       <stem>_predicted.jpg
#       <stem>_raw_seg_gen.jpg ← same seg, empty prompt (pure seg adherence)

defaults:
  - model: sd15
  - lora@lora.struct: struct
  - override /lora/encoder@lora.struct.encoder: segformer   # live SegFormer-b5 (was midas)
  - _self_

# ---- Checkpoint -----------------------------------------------------------
# Path to the checkpoint directory produced by segformer_training.py.
# Structure expected:  <ckpt_path>/struct/lora-checkpoint.pt
#                      <ckpt_path>/struct/mapper-checkpoint.pt
ckpt_path: ???     # e.g. outputs/train/seg_aspect/runs/2026-01-01/00-00-00/best_model

# ---- Resize technique ------------------------------------------------------
# "aspect" (only mode supported) only affects the ORIGINAL display panel's
# geometry here (cosmetic) — the seg map itself was already resized at CALC
# time (seg_map_calculations.py), so there's no live squaring mismatch risk
# the way there is on the grounded_sam branch. Still recorded in
# run_params.txt for a self-documenting result folder, and names the output
# folder below. MUST match the resize_mode + size used to compute your maps.
resize_mode: aspect

# ---- Global resolution (must match training) ------------------------------
size: [512, 320]    # [width, height] -- non-square, matches training config
seed: 42

# ---- Device -----------------------------------------------------------
# null (default) = auto-detect a GPU and REFUSE to run if none is visible
# (see src/utils.py resolve_device() — this script must never silently fall
# back to CPU). Set explicitly to override, e.g.:
#   python segformer_inference.py device=cuda:1 ...
#   python segformer_inference.py device=cpu ...       (explicit opt-in to CPU)
device: null

# =============================================================================
# MODEL LOADING — LOCAL vs INTERNET  (one switch: local_files_only)
# =============================================================================
# MUST match how the model was set during training so inference uses the same
# base + seg model (references.md §3 parity rule).
# Both the local folder AND the hub id are listed; the flag picks which.
#   local_files_only: true   -> use LOCAL folders (*_model_path), offline.
#   local_files_only: false  -> use HUB ids (*_model_name); download if missing.
# The choice is made in segformer_inference.py (reads this flag, sets model.model_name
# / encoder.model before the model is built). Local paths are relative to the repo
# root; the code makes them absolute.
local_files_only: true

# 2026-08 decision: matches configs/experiment/train_seg.yaml -- inference
# MUST use the SAME base checkpoint training used (parity rule). See that
# file's comments for why epiCRealism over stock SD1.5 / Realistic Vision V6.0.
base_model_name:  emilianJR/epiCRealism
base_model_path:  checkpoints/local_models/epicrealism

# Paired-in VAE upgrade, must match training. See src/model.py ModelBase.__init__.
vae_path: checkpoints/local_models/sd-vae-ft-mse

# LOCKED MODEL: b5 (references.md §9). Must match the model used during training.
seg_model_name: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
seg_model_path: checkpoints/local_models/segformer-b5-cityscapes

# ---- Base diffusion model -------------------------------------------------
model:
  model_name: ${base_model_name}   # default; segformer_inference.py overrides to base_model_path when local_files_only=true
  vae_path: ${vae_path}            # default; segformer_inference.py overrides to an absolute path when local_files_only=true

# ---- LoRA (inference mode — weights not updated) --------------------------
lora:
  struct:
    optimize: false   # frozen at inference
    encoder:
      # NOT called during inference (skip_encode=True, see segformer_inference.py's
      # docstring) -- this key exists only because the encoder slot's `model` field
      # is inspected before the encoder-model rewrite is skipped; the SAME model
      # the training maps were computed with, for provenance clarity only.
      model: ${seg_model_name}   # default; segformer_inference.py overrides to seg_model_path when local_files_only=true

# ---- Inference parameters -------------------------------------------------
# Inference ALWAYS uses a PROVIDED segmentation map -- it never computes one
# live from a raw photo. seg_maps/seg_path is REQUIRED; images/raw_image_path
# is OPTIONAL and used ONLY to display the ORIGINAL panel (no model ever runs
# on it). See segformer_inference.py module docstring for the full reasoning.
inference:
  # Input — choose ONE:
  seg_maps:  []         # list of PRE-COMPUTED seg map paths (REQUIRED for this mode),
                         # e.g. ["data/raw_seg/000417/000417_seg_map.png"]
  images:    []         # OPTIONAL, display-only, matched by index to seg_maps
  json_file: null       # OR path to JSON manifest: seg_path (required) +
                         # raw_image_path (optional, display only) + prompt per entry

  prompts:   []         # prompts for 'seg_maps' list mode; leave empty to use JSON prompts

  # Output: mode-named so results are always traceable to which technique made them.
  output_dir: outputs/inference/seg_${resize_mode}/results     # relative to repo root (resolved in segformer_inference.py)
  save_generated_only: false   # true → save only predicted image, mirroring folder structure

  # Preprocessing: squaring technique is controlled by the top-level
  # `resize_mode` key above -- affects ONLY the ORIGINAL display panel here
  # (cosmetic); the seg map's own squaring is already baked in at calc time
  # and unaffected by this key.

  # Generation:
  n_samples:           1    # number of generated images per input image
  num_inference_steps: 50   # diffusion denoising steps
  guidance_scale:      7.5  # CFG scale

  # Generation-quality knobs (see model.py sample_easy docstring for the full
  # reasoning). Defaults below are all NO-OPS — identical output to before these
  # existed. Tune these to fight the "fits the shape but doesn't know how it
  # looks" artifact (flat seg-map regions carry no appearance information):
  #   conditioning_kernel_size: odd int (e.g. 3, 5) box-blurs the seg COLOUR MAP
  #     before the mapper, softening hard silhouette edges. Does NOT add
  #     information to a region's flat interior — pairs with lora_scale decay
  #     below for that. 0 = off (default).
  conditioning_kernel_size: 0
  #   lora_scale_start/end: decay the structure-LoRA's conditioning strength
  #     over the denoising trajectory — full grip (scale_start) for the early
  #     LAYOUT-deciding steps, fading to scale_end for the late DETAIL-deciding
  #     steps, so the model can lean on its own trained prior for appearance
  #     instead of a flat conditioning signal. Equal start/end = off (default).
  #     Try e.g. lora_scale_start=1.0, lora_scale_end=0.4 as a first experiment.
  lora_scale_start: 1.0
  lora_scale_end: 1.0
  #   lora_scale_decay_start_frac: fraction of steps (0..1) held at full
  #     lora_scale_start before decay begins (0.3 = first 30% of steps).
  lora_scale_decay_start_frac: 0.3

hydra:
  run:
    dir: outputs/inference/seg_${resize_mode}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true
