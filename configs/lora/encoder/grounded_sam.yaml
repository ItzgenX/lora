defaults:
  - _self_

# Grounded-SAM encoder slot (Tier 1 — training on pre-saved maps).
#
# This is a LIGHTWEIGHT slot filler, NOT a live segmenter. Training feeds
# pre-computed Grounded-SAM colour maps straight to the mapper via
# skip_encode=True, so the encoder's forward() is never called and no
# GroundingDINO/SAM weights are loaded. It only needs to exist as an nn.Module
# for accelerate to .prepare().
#
# Deliberately has NO `model` key (unlike segformer.yaml): there is no HF
# checkpoint to load. seg_training.py detects the absence and skips the
# encoder.model rewrite + the live-segmenter mIoU metric automatically.
#
# Live map generation for inference on NEW images is Tier 2 (not built here).
_target_: src.encoders.grounded_sam_encoder.GroundedSamEncoder
size: ${size}
