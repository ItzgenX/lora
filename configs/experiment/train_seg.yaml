# @package _global_
#
# configs/experiment/train_seg.yaml
# -----------------------------------
# Unified segmentation experiment config — ONE config for any GPU setup.
# Supersedes train_seg_12gb.yaml and train_seg_cluster.yaml (cluster not needed).
# This is the direct segmentation twin of configs/experiment/train_depth.yaml.
# The ONLY differences from depth are flagged inline with "DIFF:".

defaults:
  - /lora@lora.struct: struct
  - override /lora/encoder@lora.struct.encoder: segformer   # DIFF: SegFormer-b5 (was midas)
  - override /model: sd15
  - override /data: local_seg                                # DIFF: seg data module (was local_depth)
  - _self_

# =============================================================================
# MODEL LOADING — LOCAL vs INTERNET  (one switch: local_files_only)
# =============================================================================
# Both the local folder AND the hub id are listed below; the flag picks which.
#   local_files_only: true  -> use LOCAL folders (*_model_path). Fully offline.
#   local_files_only: false -> use HUB ids (*_model_name); downloads if missing.
# The choice is made in segformer_training.py (sets model.model_name / encoder.model).
# Local paths are relative to the repo root; the code makes them absolute.
local_files_only: true

# 2026-08 decision: stock SD1.5 output looked messy/unnatural (see the
# AM.jpeg/result.jpeg diagnosis session). Switched to epiCRealism, a
# photorealistic SD1.5-ARCHITECTURE finetune -- same UNet, same state-dict
# keys, so add_lora_to_unet needs ZERO changes. Chosen over Realistic Vision
# V6.0 because it ships as a ready-to-use diffusers pipeline (V6.0 is
# safetensors-only and would need from_single_file() support this repo
# doesn't have). Download via: python download_sd15.py
base_model_name:  emilianJR/epiCRealism
base_model_path:  checkpoints/local_models/epicrealism

# Paired-in VAE upgrade (stabilityai/sd-vae-ft-mse) -- see model.vae_path
# below and src/model.py ModelBase.__init__. Also REQUIRED if you ever swap
# to a "noVAE"-style checkpoint (e.g. Realistic Vision's noVAE build), which
# ships without its own VAE weights at all.
vae_path: checkpoints/local_models/sd-vae-ft-mse

# DIFF: SegFormer b5 (was dpt-hybrid-midas).
# LOCKED: b5 for best seg map quality — references.md §9.
seg_model_name: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
seg_model_path: checkpoints/local_models/segformer-b5-cityscapes

# =============================================================================
# HARDWARE  —  plain, fixed values. NOTHING here auto-scales at runtime.
# =============================================================================
# data.batch_size, gradient_accumulation_steps, and gradient_checkpointing
# below are exactly what runs. For a suggested starting point on your actual
# GPU + dataset (prints only, never edits this file):
#   python recommend_training_params.py
#   For cluster: accelerate launch --num_processes=N segformer_training.py ...
#   (values below are PER-GPU; re-run recommend_training_params.py and edit
#   this file yourself if cluster GPUs have a different VRAM size)
gradient_checkpointing: false           # OFF: this is a pure recompute-vs-store speed/VRAM
                                        # tradeoff, mathematically IDENTICAL training results
                                        # either way -- only relevant on a memory-constrained
                                        # GPU. On 4x95GB the ~800MB it would save is meaningless;
                                        # off = ~20% faster steps for free. (batch_size below is
                                        # NOT bumped to match -- that changes gradient dynamics,
                                        # a real decision, not a free lunch like this one.)
gradient_accumulation_steps: 4        # 4 bsz x 4 accum = 16 effective batch
size: [512, 320]                       # [width, height] -- non-square, matches 1280x800 source
                                        # aspect ratio (1.6:1) EXACTLY (1280/800 = 512/320 = 1.6),
                                        # divisible by 64 (SD1.5 UNet requirement -- field guide
                                        # Lesson 4), and caps the LONG side at exactly SD1.5's
                                        # native 512 -- the safest non-square choice re: the
                                        # high-resolution duplication-artifact risk (a larger
                                        # same-ratio target like 832x512 exceeds native by 62%
                                        # on the long side; untested, don't assume it's fine)

# --- Resize technique (2026-08 decision, supersedes 2026-07-20's letterbox default) --- #
# "aspect" = direct resize to the non-square (width,height) `size` above -- NO
#            pad, NO crop. Replaces letterbox after AM.jpeg showed the model
#            LEARNING the letterbox pad band as real scene content (visible in
#            ORIGINAL, SEG MAP, and PREDICTED panels of a real checkpoint grid).
# "letterbox" = SquarePad, keeps full scene, adds a pad band. Old default, kept
#              available for comparison, not recommended anymore.
# "CenterCrop" = original stock LoRAdapter recipe, no pad band, crops scene edges.
# MUST match the mode seg_map_calculations.py used to compute your maps.
#   python seg_map_calculations.py --data_dir data/ --resize_mode aspect --width 512 --height 320
#   python segformer_training.py experiment=train_seg resize_mode=aspect
# Drives data.resize_mode (below, via ${resize_mode}) AND the output folder
# name via `tag`, so a trained model's folder always says which technique
# (and therefore which map set) produced it.
resize_mode: aspect

# =============================================================================
# 1. GENERAL TRAINING PARAMETERS  (identical to depth — required for valid comparison)
# =============================================================================
#
# ── DATASET MATH (YOUR real dataset: 59,766 train / 3,314 val / 3,327 test) ──
#   effective batch = batch_size(4) x grad_accum(4) = 16
#   steps / epoch    = ceil(59,766 / 16) = 3,736 optimizer steps
#   5 epochs total   = 3,736 x 5 = 18,680 optimizer steps
#   val_steps  = 500  ->  ~7 val/loss checks per epoch  (cheap: no_grad + few batches)
#   ckpt_steps = 1000 ->  ~3-4 step-level checkpoint saves per epoch (heavy: weights + images)
#   (VERIFIED 2026-07-02: peak VRAM ~11.1GB/12GB at batch_size=4 on a reference
#   12GB GPU -- IDENTICAL to depth's measured peak (skip_encode=True means the
#   SegFormer encoder is NOT in the training forward pass, confirmed by real
#   measurement, not assumed). Per-step wall-clock time is HARDWARE-DEPENDENT
#   and was only measured on a reference GPU, not the actual A2000/Linux
#   target -- see SEGMENTATION.md training-timing section for the exact
#   self-measurement command to run once on real target hardware.)
#   CHECKPOINT RESUME: verified limitation -- weights reload correctly, but
#   LR schedule / global_step restart from 0.
#
learning_rate: 1.0e-4
lr_warmup_steps: 500               # ~13 % of epoch 1 (500 / 3736 steps)
lr_scheduler: cosine               # decays 1e-4 -> ~0 over the full run

epochs: 5                          # 5 x 3,736 = 18,680 optimizer steps (YOUR dataset)

# ── DECOUPLED val/checkpoint triggers ──────────────────────────────────────────
# val_steps  : compute val/loss (+ update best_model/ if improved). CHEAP.
# ckpt_steps : write weights + N monitoring images to disk. HEAVY (measured
#              ~52s per 10-image grid + ~33s val).
# These are INDEPENDENT — validate every 500 but only save disk every 1000.
val_steps:  500
ckpt_steps: 1000

# =============================================================================
# 2. DATA  (DIFF: seg manifests + seg data module; all other settings identical)
# =============================================================================
#   JSON keys read by SegJsonDataset (src/data/local_seg.py):
#     "raw_image_path" -> source RGB image
#     "seg_path"       -> pre-computed class-ID PNG (run calculate_segmentation_map.py)
#     "prompt"         -> text caption
data:
  batch_size:     4         # per-GPU max for 12 GB with gradient_checkpointing
  val_batch_size: 4         # val uses no_grad — 4 is safe, gives 4x more coverage
  workers:        4
  val_workers:    2
  # DIFF: seg_training/ (was depth_training/). Mode-named (resize_mode above):
  # Built by: python seg_map_calculations.py --data_dir data/ --resize_mode letterbox
  json_file:     data/seg_training_${resize_mode}/train.jsonl
  val_json_file: data/seg_training_${resize_mode}/val.jsonl   # NEVER test.jsonl here (references.md §8)

# =============================================================================
# 3. GLOBAL FALLBACK PROMPT  (identical to depth)
# =============================================================================
prompt: null    # null -> each image uses its own "prompt" field from the JSON

# =============================================================================
# 4. OPERATIONAL SETTINGS  (identical to depth, except seg grid knobs and tag)
# =============================================================================
seed: 42
val_batches: 64        # val/loss averaged over 64 x 4 = 256 val images (~6% of 4K set)
log_every_steps: 50    # mirror step/loss/lr into seg_training.log every N optimizer steps

# ── Checkpoint-monitoring images ─────────────────────────────────────────────
# Every checkpoint writes N labeled validation images into its own folder
# (ORIGINAL | SEG MAP | PREDICTED), split 50/50 fixed/fresh:
#   fixed half: same scenes every checkpoint -> watch them improve over training.
#   fresh half: re-randomized -> generalization peek on unseen scenes.
# Source = validation set only (never train/test).
n_grid_images: 10                # 10 val scenes per checkpoint (5 fixed + 5 fresh)
grid_include_empty_prompt: false # OFF -> generate WITH prompt only (matches depth)
                                 # true -> also add a 4th "RAW SEG GEN" panel (empty-prompt gen)

# =============================================================================
# 5. PRECISION  (identical to depth)
# =============================================================================
bf16: true
ignore_check: true                # live: silences the checkpoint-key completeness assert in add_lora_from_config
tag: seg_${resize_mode}           # DIFF: "seg_letterbox"/"seg_CenterCrop" -> outputs/train/seg_<mode>/...

# =============================================================================
# 6. MODEL OVERRIDES  (identical to depth)
# =============================================================================
model:
  _target_: src.model.SD15
  pipeline_type: diffusers.StableDiffusionPipeline
  model_name: ${base_model_name}   # train_seg.py overrides to base_model_path when local
  local_files_only: ${local_files_only}
  guidance_scale: 7.5
  vae_path: ${vae_path}            # sd-vae-ft-mse, see src/model.py ModelBase.__init__

# =============================================================================
# 7. LORA ARCHITECTURE  (rank/c_dim/adaption_mode IDENTICAL to depth: 128/128/only_res_conv)
# =============================================================================
lora:
  struct:
    optimize: true
    cfg: false
    ckpt_path: null                # set to resume, e.g. "outputs/train/seg/runs/.../step1000"
    encoder:                       # DIFF: SegmentationEncoder (was DepthEstimator)
      _target_: src.encoders.seg_encoder.SegmentationEncoder
      model: ${seg_model_name}     # train_seg.py overrides to seg_model_path when local
      size: ${size}
      local_files_only: ${local_files_only}
    config:
      adaption_mode: only_res_conv
      rank: 128
      c_dim: 128
      lora_scale: 1

# LAUNCH COMMANDS:
#   Single 12 GB GPU:
#     python segformer_training.py experiment=train_seg
#
#   Multi-GPU (if needed later):
#     accelerate launch --num_processes=N segformer_training.py experiment=train_seg
#     # With N GPUs, effective batch = 4 x 4 x N. Consider scaling LR by sqrt(N).
