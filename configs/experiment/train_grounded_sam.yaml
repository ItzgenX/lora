# @package _global_
#
# configs/experiment/train_grounded_sam.yaml
# ------------------------------------------
# Grounded-SAM training experiment. Reuses the ENTIRE segmentation pipeline
# (grounded_sam_training.py, SegJsonDataModule, the struct LoRA + mapper) and swaps only:
#   • the encoder slot     -> GroundedSamEncoder (training-only slot filler)
#   • the data module      -> local_grounded_sam (your class palette + manifests)
# Everything else (LoRA rank/mode, LR, schedule, grid knobs) is identical to the
# SegFormer config so results stay comparable.
#
# Differences from train_seg.yaml are flagged inline with "DIFF:".

defaults:
  - /lora@lora.struct: struct
  - override /lora/encoder@lora.struct.encoder: grounded_sam   # DIFF: GroundedSamEncoder (was segformer)
  - override /model: sd15
  - override /data: local_grounded_sam                          # DIFF: Grounded-SAM data module (was local_seg)
  - _self_

# =============================================================================
# MODEL LOADING — LOCAL vs INTERNET  (one switch: local_files_only)
# =============================================================================
# Only the BASE diffusion model is loaded now — there is NO seg encoder model to
# load (GroundedSamEncoder is a slot filler; training uses pre-saved maps). So
# unlike train_seg.yaml there are no seg_model_name/seg_model_path keys here.
local_files_only: true

# 2026-08 decision: stock SD1.5 output looked messy/unnatural. Switched to
# epiCRealism, a photorealistic SD1.5-ARCHITECTURE finetune -- same UNet,
# same state-dict keys, so add_lora_to_unet needs ZERO changes. Chosen over
# Realistic Vision V6.0 because it ships as a ready-to-use diffusers pipeline
# (V6.0 is safetensors-only, needs from_single_file() support this repo
# doesn't have). Download via: python download_sd15.py
base_model_name:  emilianJR/epiCRealism
base_model_path:  checkpoints/local_models/epicrealism

# Paired-in VAE upgrade (stabilityai/sd-vae-ft-mse) -- see model.vae_path
# below and src/model.py ModelBase.__init__.
vae_path: checkpoints/local_models/sd-vae-ft-mse

# =============================================================================
# HARDWARE — plain, fixed values. Nothing auto-scales at runtime.
# =============================================================================
# For a suggested starting point on your GPU + dataset (prints only, never edits):
#   python recommend_training_params.py --data_dir data/grounded_sam
#   Multi-GPU: accelerate launch --num_processes=N grounded_sam_training.py experiment=train_grounded_sam
gradient_checkpointing: false           # OFF: this is a pure recompute-vs-store speed/VRAM
                                        # tradeoff, mathematically IDENTICAL training results
                                        # either way -- only relevant on a memory-constrained
                                        # GPU. On a large multi-GPU box the VRAM it would save
                                        # is meaningless; off = faster steps for free. (batch_size
                                        # below is NOT bumped to match -- that changes gradient
                                        # dynamics, a real decision, not a free lunch like this one.)
gradient_accumulation_steps: 4        # 4 batch x 4 accum = 16 effective batch
size: [512, 320]                       # [width, height] -- non-square, matches 1280x800 source
                                        # aspect ratio EXACTLY (1280/800 = 512/320 = 1.6),
                                        # divisible by 64 (SD1.5 UNet requirement -- field guide
                                        # Lesson 4), keeps the long side AT (not beyond) SD1.5's
                                        # native 512 -- the safer choice vs. a larger same-ratio
                                        # target like 832x512 (untested, higher duplication risk)

# --- Resize technique (2026-08 decision, supersedes letterbox default) --- #
# "aspect" (default) = direct resize to the non-square `size` above -- NO
#   pad, NO crop. Replaces letterbox after the segformer branch's AM.jpeg
#   checkpoint grid showed the model LEARNING the letterbox pad band as real
#   scene content (same shared SquarePad code, same mechanism applies here).
# "letterbox" = SquarePad, keeps full scene, adds a pad band. Old default,
#   kept for comparison, not recommended anymore.
# "CenterCrop" = original stock LoRAdapter recipe, no pad band, crops scene edges.
#   python grounded_sam_training.py experiment=train_grounded_sam resize_mode=letterbox
#   python grounded_sam_training.py experiment=train_grounded_sam resize_mode=CenterCrop
# Drives data.resize_mode (below) AND the output folder name via `tag`, so a
# trained model's folder always says which technique produced it.
resize_mode: aspect

# =============================================================================
# 1. GENERAL TRAINING PARAMETERS
# =============================================================================
# Sized for the REAL dataset: 30,000 train / 10,000 val / 10,000 test images.
#   effective batch = batch_size(4) x grad_accum(4) = 16   (this file's baseline
#     single-GPU config — a cluster sbatch script overriding data.batch_size/
#     gradient_accumulation_steps for its own GPU count MUST recompute
#     val_steps/ckpt_steps/lr_warmup_steps for its own effective batch, since
#     these are STEP counts and steps/epoch depends on effective batch. See
#     slurm/train_grounded_sam_jupiter.sbatch for the 4-GPU recomputation.)
#   steps/epoch     = ceil(30,000 / 16) = 1,875
learning_rate: 1.0e-4
lr_warmup_steps: 250   # ~13% of epoch 1 (250 / 1875 steps)
lr_scheduler: cosine
epochs: 10              # 10 x 1,875 = 18,750 optimizer steps (this file's baseline)

# DECOUPLED triggers: validate cheaply often, save weights+images less often.
val_steps:  250    # ~7 val/loss checks per epoch  (1875 / 7 ≈ 268, rounded)
ckpt_steps: 500    # ~3-4 checkpoint saves per epoch (1875 / 3.5 ≈ 536, rounded)

# =============================================================================
# 2. DATA  (DIFF: Grounded-SAM manifests + class palette)
# =============================================================================
# The class palette + JSONL key names are set in configs/data/local_grounded_sam.yaml
# (classes_file / image_key / seg_key / prompt_key). Override any of them here if
# needed, e.g.:  data.seg_key=mask   data.classes_file=configs/my_classes.json
data:
  batch_size:     4
  val_batch_size: 4
  workers:        4
  val_workers:    2
  # DIFF: Grounded-SAM manifests. Build/point these at your (raw_image, seg_map,
  # prompt) JSONLs. val_json_file must be the real val split — NEVER test.
  json_file:     data/grounded_sam/train.jsonl
  val_json_file: data/grounded_sam/val.jsonl

# =============================================================================
# 3. GLOBAL FALLBACK PROMPT
# =============================================================================
prompt: null    # null -> each image uses its own prompt field from the JSONL

# =============================================================================
# 4. OPERATIONAL SETTINGS
# =============================================================================
seed: 42
val_batches: 64
log_every_steps: 50

# Checkpoint-monitoring images: N labeled val scenes per checkpoint
# (ORIGINAL | SEG MAP | PREDICTED), 50/50 fixed/fresh. Source = validation set.
# NOTE: the mIoU controllability metric is automatically SKIPPED for Grounded-SAM
# (it needs a live segmenter, which is Tier 2). PSNR/SSIM + grids still run.
n_grid_images: 10
grid_include_empty_prompt: false

# =============================================================================
# 5. PRECISION
# =============================================================================
bf16: true
ignore_check: true
tag: grounded_sam_${resize_mode}  # DIFF: outputs/train/grounded_sam_letterbox/... or
                                   # outputs/train/grounded_sam_CenterCrop/... — the
                                   # folder name always says which technique trained it.

# =============================================================================
# 6. MODEL OVERRIDES
# =============================================================================
model:
  _target_: src.model.SD15
  pipeline_type: diffusers.StableDiffusionPipeline
  model_name: ${base_model_name}   # grounded_sam_training.py overrides to base_model_path when local
  local_files_only: ${local_files_only}
  guidance_scale: 7.5
  vae_path: ${vae_path}            # sd-vae-ft-mse, see src/model.py ModelBase.__init__

# =============================================================================
# 7. LORA ARCHITECTURE  (identical to the SegFormer config)
# =============================================================================
lora:
  struct:
    optimize: true
    cfg: false
    ckpt_path: null
    encoder:                       # DIFF: GroundedSamEncoder slot filler (no `model` key)
      _target_: src.encoders.grounded_sam_encoder.GroundedSamEncoder
      size: ${size}
    config:
      adaption_mode: only_res_conv
      rank: 128
      c_dim: 128
      lora_scale: 1

# LAUNCH:
#   Single GPU : python grounded_sam_training.py experiment=train_grounded_sam
#   Multi-GPU  : accelerate launch --num_processes=N grounded_sam_training.py experiment=train_grounded_sam
