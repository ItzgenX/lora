_target_: src.data.local_seg.SegJsonDataModule

# Stage D data module. Twin of local_depth.yaml — same RGB transform chain; the
# segmentation map is loaded + colourised INSIDE SegJsonDataset (raw-ID PNG ->
# NEAREST resize -> Cityscapes palette), so no seg-specific transform appears here.
json_file:     ???
val_json_file: null
# image_root: null   # set to override image base path when images are not under repo root
#                    # e.g. image_root: /mnt/datasets
image_root: null
size: ${size}
batch_size: 4
val_batch_size: 4       # 4 is safe under no_grad; matches depth default (was 1)
workers: 4
val_workers: 2

# --- Resize technique -------------------------------------------------------- #
# "letterbox"  : SquarePad (flat-fill pad) then Resize — keeps 100% of the
#                scene, adds a flat-colour pad band. Default.
# "CenterCrop" : the ORIGINAL stock LoRAdapter recipe (configs/data/local.yaml)
#                — Resize(size) then CenterCrop(size). No pad band, crops edges.
# Drives the RGB transform (SegJsonDataModule builds it from this key via
# src/data/transforms.py build_seg_preprocess). MUST match the resize_mode
# seg_map_calculations.py used to COMPUTE the seg maps this manifest's
# seg_path entries point at — unlike the grounded_sam branch, the map's
# geometry is baked in at calc time here, not re-applied live at load time.
# Override on the command line to compare the two:
#   python segformer_training.py experiment=train_seg resize_mode=CenterCrop
resize_mode: ${resize_mode}
