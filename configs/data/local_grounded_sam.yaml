_target_: src.data.local_seg.SegJsonDataModule

# Grounded-SAM data module. Reuses SegJsonDataModule (the SegFormer seg loader),
# with two differences from local_seg.yaml:
#   1. classes_file: builds the colour palette from YOUR Grounded-SAM class set
#      (id -> name), instead of the fixed 19-class Cityscapes palette. The saved
#      raw-ID PNG is colourised at load time with this palette (NEAREST resize),
#      so training and any later inference stay pixel-identical.
#   2. image_key / seg_key / prompt_key: point at whatever keys YOUR train.jsonl
#      actually uses. Defaults below match the SegFormer manifest; change them if
#      your Grounded-SAM export used different names (e.g. "image" / "mask").
json_file:     ???                       # data/grounded_sam/train.jsonl
val_json_file: null                      # data/grounded_sam/val.jsonl (NEVER test)
image_root: null                         # prefix for relative image/seg paths, if any

# --- Grounded-SAM class set ------------------------------------------------- #
# Fill configs/grounded_sam_classes.json with your ACTUAL classes (id->name, in
# the exact order your saved maps use) BEFORE training. Run
# scan_seg_map_classes.py first to confirm how many classes your maps contain.
classes_file: configs/grounded_sam_classes.json

# --- Manifest key names (override to match your JSONL) ----------------------- #
image_key:  raw_image_path
seg_key:    seg_path
prompt_key: prompt

size: ${size}
batch_size: 4
val_batch_size: 4
workers: 4
val_workers: 2

# Same RGB preprocessing chain as the SegFormer pipeline (letterbox square ->
# resize -> [-1,1]). The seg map is colourised inside SegJsonDataset, so no
# seg-specific transform appears here.
transform:
  - _target_: src.data.transforms.SquarePad      # pad shorter side -> square (flat local-mean fill)
  - _target_: torchvision.transforms.Resize
    size:
      - ${size}
      - ${size}
  - _target_: torchvision.transforms.ToTensor     # [0,255] -> [0,1]
  - _target_: torchvision.transforms.Normalize    # [0,1] -> [-1,1]
    mean: [0.5, 0.5, 0.5]
    std:  [0.5, 0.5, 0.5]
