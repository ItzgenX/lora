_target_: src.data.local_seg.SegJsonDataModule

# Grounded-SAM data module. Reuses SegJsonDataModule (the SegFormer seg loader),
# with two differences from local_seg.yaml:
#   1. classes_file: builds the colour palette from YOUR Grounded-SAM class set
#      (id -> name), instead of the fixed 19-class Cityscapes palette. The saved
#      raw-ID PNG is colourised at load time with this palette (NEAREST resize),
#      so training and any later inference stay pixel-identical.
#   2. image_key / seg_key / prompt_key: point at whatever keys YOUR train.jsonl
#      actually uses. Defaults below match the SegFormer manifest; change them if
#      your Grounded-SAM export used different names (e.g. "image" / "mask").
json_file:     ???                       # data/grounded_sam/train.jsonl
val_json_file: null                      # data/grounded_sam/val.jsonl (NEVER test)
image_root: null                         # prefix for relative image/seg paths, if any

# --- Grounded-SAM class set ------------------------------------------------- #
# Fill configs/grounded_sam_classes.json with your ACTUAL classes (id->name, in
# the exact order your saved maps use) BEFORE training. Run
# scan_seg_map_classes.py first to confirm how many classes your maps contain.
classes_file: configs/grounded_sam_classes.json

# --- Manifest key names (override to match your JSONL) ----------------------- #
image_key:  raw_image_path
seg_key:    seg_path
prompt_key: prompt

# --- Non-square map handling --------------------------------------------------- #
# The REAL masks (16-bit PNG, mode I;16,
# 1280x800, CARLA ids) are SQUARED by the loader using the SAME technique
# (resize_mode, below) as the paired RGB image, then NEAREST-resized. Never
# stretched independently (stretching misaligned map vs image by up to ~19%
# of the frame). 0 = CARLA "Unlabeled"; change only if your taxonomy uses a
# different void class.
pad_id: 0

# --- Resize technique -------------------------------- #
# "letterbox"  : SquarePad (flat-fill pad) then Resize — keeps 100% of the
#                scene, adds a flat-colour pad band top/bottom. Default.
# "CenterCrop" : the ORIGINAL stock LoRAdapter recipe (configs/data/local.yaml)
#                — Resize(size) then CenterCrop(size). No pad band, but crops
#                ~37% of width off the left/right for this project's frames.
# Drives BOTH the RGB transform and the seg-map geometry (SegJsonDataModule
# builds both from this one key via src/data/transforms.py), so they can
# never disagree. Override on the command line to compare the two:
#   python grounded_sam_training.py experiment=train_grounded_sam resize_mode=CenterCrop
resize_mode: ${resize_mode}

size: ${size}
batch_size: 4
val_batch_size: 4
workers: 4
val_workers: 2

# RGB preprocessing (letterbox-or-crop -> resize -> [-1,1]) is built in Python
# by SegJsonDataModule from `resize_mode` above (src/data/transforms.py
# build_seg_preprocess) — not declared as a Hydra transform list here, so
# there is exactly one code path to keep in sync, not two.
